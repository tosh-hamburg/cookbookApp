# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.uniquePackageNames=false
android.r8.strictFullModeForKeepRules=false

# AGP 9 bringt Kotlin-Unterstuetzung mit und registriert dafuer eine eigene
# "kotlin"-Extension. Das Projekt wendet org.jetbrains.kotlin.android an —
# beides zusammen scheitert an der doppelten Extension. Das Flag bleibt, bis
# der Build auf AGP-eigenes Kotlin umgestellt ist; AGP meldet es als
# deprecated, weil es eine Uebergangsloesung ist.
android.builtInKotlin=false

# Dasselbe Plugin castet die android-Extension auf BaseExtension, die es nur
# in der alten DSL gibt. Mit AGP 9s neuer DSL scheitert das Anwenden.
android.newDsl=false

# Use Android Studio's bundled Gradle distribution
# Uncomment if you have network issues:
# org.gradle.distribution.url=

# Proxy settings (uncomment and configure if behind proxy)
# systemProp.http.proxyHost=proxy.example.com
# systemProp.http.proxyPort=8080
# systemProp.https.proxyHost=proxy.example.com
# systemProp.https.proxyPort=8080
